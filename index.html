<!DOCTYPE html>
<html>
<head>
  <title>Product Comparison</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .compare-box { display: flex; gap: 20px; }
    .product { border: 1px solid #ccc; padding: 10px; width: 45%; }
    .feature { margin-bottom: 5px; }
    .highlight { background-color: #d4edda; }
  </style>
</head>
<body>
  <h1>Compare Products</h1>
  <div class="compare-box">
    <div class="product" id="product1">
      <h3>Samsung Galaxy A12</h3>
      <div class="feature">Price: Rs. 28,000</div>
      <div class="feature">RAM: 4 GB</div>
      <div class="feature">Storage: 64 GB</div>
      <div class="feature">Battery: 5000 mAh</div>
    </div>
    <div class="product" id="product2">
      <h3>Infinix Hot 10</h3>
      <div class="feature">Price: Rs. 24,000</div>
      <div class="feature">RAM: 4 GB</div>
      <div class="feature">Storage: 128 GB</div>
      <div class="feature">Battery: 5200 mAh</div>
    </div>
  </div>
</body>
</html>
